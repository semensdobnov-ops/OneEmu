name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o OneEmu.zip -d project
          echo "--- ФАЙЛЫ ПОСЛЕ РАСПАКОВКИ ---"
          ls -la project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5 # Принудительно ставим 8.5

      - name: Build with Gradle
        run: |
          if [ -f "project/build.gradle.kts" ] || [ -f "project/build.gradle" ]; then
            cd project
          else
            cd project/*/
          fi
          
          echo "Собираем проект в папке: $(pwd)"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneEmu-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
