name: Build OneEmu ARM64 APK
on: [push, workflow_dispatch]

jobs:
  qemu:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build static ARM64 QEMU
        run: |
          set -euxo pipefail
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -c '
            set -e
            apk add --no-cache build-base git python3 py3-setuptools ninja meson pkgconf bash flex bison perl curl xz bzip2 linux-headers
            for p in glib-dev glib-static pixman-dev pixman-static zlib-dev zlib-static pcre2-dev libffi-dev gettext-dev gettext-static zstd-dev zstd-static util-linux-dev; do
              apk add --no-cache "$p" || echo "SKIP $p"
            done
            cd /tmp
            curl -fLO https://download.qemu.org/qemu-9.0.2.tar.xz
            tar xf qemu-9.0.2.tar.xz
            cd qemu-9.0.2
            SLIRP=1
            (git clone --depth 1 --branch v4.8.0 https://gitlab.freedesktop.org/slirp/libslirp.git /tmp/libslirp && cd /tmp/libslirp && meson setup build --default-library=static --prefix=/usr/local && ninja -C build install) || SLIRP=0
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig
            OPTS="--static --target-list=aarch64-softmmu --disable-docs --disable-tools --disable-guest-agent --disable-werror --disable-gtk --disable-sdl --disable-opengl --disable-curses --disable-kvm --disable-dbus-display --disable-gio --disable-bzip2 --enable-vnc"
            if [ "$SLIRP" = 1 ]; then ./configure $OPTS --enable-slirp || ./configure $OPTS --disable-slirp; else ./configure $OPTS --disable-slirp; fi
            make -j"$(nproc)" qemu-system-aarch64
            grep -q "define CONFIG_VNC 1" build/config-host.h
            build/qemu-system-aarch64 -device help 2>&1 | grep -q "virtio-gpu-pci"
            build/qemu-system-aarch64 -device help 2>&1 | grep -q "ramfb"
            mkdir -p /w/qemu-out/share
            strip build/qemu-system-aarch64
            cp build/qemu-system-aarch64 /w/qemu-out/libqemu.so
            bzip2 -dk pc-bios/edk2-aarch64-code.fd.bz2
            cp pc-bios/edk2-aarch64-code.fd /w/qemu-out/share/
            cp pc-bios/efi-virtio.rom /w/qemu-out/share/ 2>/dev/null || true
            cp -r pc-bios/keymaps /w/qemu-out/share/ 2>/dev/null || true
          '
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-arm64
          path: qemu-out

  apk:
    needs: qemu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qemu-arm64
          path: qemu-out
      - name: Locate project and install ARM64 QEMU
        run: |
          SET=$(find . -name settings.gradle.kts -not -path "./qemu-out/*" -not -path "*/build/*" | head -1)
          if [ -z "$SET" ] && [ -f OneEmu.zip ]; then
            unzip -q -o OneEmu.zip -d unpacked
            SET=$(find unpacked -name settings.gradle.kts | head -1)
          fi
          if [ -z "$SET" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          PROJ=$(dirname "$SET")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          F="$PROJ/app/src/main/java/com/oneemu/app/HomeScreen.kt"
          grep -q "ExperimentalFoundationApi" "$F" || sed -i '1i @file:OptIn(androidx.compose.foundation.ExperimentalFoundationApi::class)' "$F"
          mkdir -p "$PROJ/app/src/main/jniLibs/arm64-v8a" "$PROJ/app/src/main/assets/qemu-share"
          test -s qemu-out/libqemu.so
          cp qemu-out/libqemu.so "$PROJ/app/src/main/jniLibs/arm64-v8a/libqemu.so"
          cp -r qemu-out/share/. "$PROJ/app/src/main/assets/qemu-share/"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: gradle -p "$PROJ" assembleDebug
      - name: Verify ARM64 QEMU is packaged
        run: unzip -l "$PROJ/app/build/outputs/apk/debug/app-debug.apk" | grep -E "libqemu\.so|qemu-share/edk2-aarch64-code.fd"
      - uses: actions/upload-artifact@v4
        with:
          name: OneEmu-ARM64-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
