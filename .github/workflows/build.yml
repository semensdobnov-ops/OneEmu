name: Build APK with QEMU
on: [push, workflow_dispatch]
jobs:
  qemu:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build static QEMU (arm64)
        run: |
          cat > build-qemu.sh <<'SCRIPT'
          set -e
          apk add --no-cache build-base git python3 py3-setuptools ninja meson pkgconf bash flex bison perl curl xz linux-headers
          for p in glib-dev glib-static pixman-dev pixman-static zlib-dev zlib-static libslirp-dev pcre2-dev libffi-dev gettext-dev gettext-static zstd-dev zstd-static util-linux-dev; do
            apk add --no-cache "$p" || echo "SKIP $p"
          done
          cd /tmp
          curl -fLO https://download.qemu.org/qemu-9.0.2.tar.xz
          tar xf qemu-9.0.2.tar.xz
          cd qemu-9.0.2
          OPTS="--static --target-list=x86_64-softmmu --disable-docs --disable-tools --disable-guest-agent --disable-werror --disable-gtk --disable-sdl --disable-opengl --disable-curses --disable-kvm"
          ./configure $OPTS || { echo "CONFIGURE FAILED, retry without slirp"; ./configure $OPTS --disable-slirp; }
          make -j"$(nproc)"
          mkdir -p /w/out/share
          strip build/qemu-system-x86_64
          cp build/qemu-system-x86_64 /w/out/libqemu.so
          for f in bios-256k.bin vgabios-stdvga.bin kvmvapic.bin linuxboot_dma.bin efi-virtio.rom efi-e1000.rom; do
            cp pc-bios/$f /w/out/share/
          done
          ls -la /w/out /w/out/share
          SCRIPT
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh build-qemu.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qemu
          path: out
  apk:
    needs: qemu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qemu
          path: qemu-out
      - name: Put QEMU into the app
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/qemu-share
          cp qemu-out/libqemu.so app/src/main/jniLibs/arm64-v8a/libqemu.so
          cp qemu-out/share/* app/src/main/assets/qemu-share/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug
      - name: Check that QEMU is inside the APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "libqemu.so|qemu-share/bios"
      - uses: actions/upload-artifact@v4
        with:
          name: OneEmu-APK-with-QEMU
          path: app/build/outputs/apk/debug/app-debug.apk
