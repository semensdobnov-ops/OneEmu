
name: Build OneEmu APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneemu-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-qemu:
    name: Build QEMU ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build QEMU
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine:3.20 sh -euxc '

              apk add --no-cache \
                build-base \
                git \
                python3 \
                py3-setuptools \
                ninja \
                meson \
                pkgconf \
                bash \
                flex \
                bison \
                perl \
                curl \
                xz \
                linux-headers \
                bzip2 \
                glib-dev \
                pixman-dev \
                zlib-dev \
                pcre2-dev \
                libffi-dev \
                gettext-dev \
                zstd-dev \
                util-linux-dev \
                util-linux-static

              cd /tmp

              curl -fL \
                https://download.qemu.org/qemu-9.0.2.tar.xz \
                -o qemu.tar.xz

              tar -xf qemu.tar.xz

              cd qemu-9.0.2

              ./configure \
                --target-list=aarch64-softmmu \
                --disable-docs \
                --disable-tools \
                --disable-guest-agent \
                --disable-werror \
                --disable-gtk \
                --disable-sdl \
                --disable-opengl \
                --disable-curses \
                --disable-kvm \
                --disable-dbus-display \
                --disable-slirp \
                --disable-bzip2 \
                --disable-libudev \
                --disable-linux-aio

              make -j"$(nproc)" qemu-system-aarch64

              mkdir -p /work/qemu-out/bin
              mkdir -p /work/qemu-out/share

              cp build/qemu-system-aarch64 \
                /work/qemu-out/bin/qemu-system-aarch64

              strip /work/qemu-out/bin/qemu-system-aarch64

              bzip2 -dk pc-bios/edk2-aarch64-code.fd.bz2

              cp pc-bios/edk2-aarch64-code.fd \
                /work/qemu-out/share/

              if [ -f pc-bios/efi-virtio.rom ]; then
                cp pc-bios/efi-virtio.rom \
                  /work/qemu-out/share/
              fi

              if [ -d build/pc-bios/keymaps ]; then
                cp -r build/pc-bios/keymaps \
                  /work/qemu-out/share/
              fi

              echo "QEMU build completed"
            '

      - name: Verify QEMU
        run: |
          set -euo pipefail

          test -s qemu-out/bin/qemu-system-aarch64
          test -s qemu-out/share/edk2-aarch64-code.fd

          file qemu-out/bin/qemu-system-aarch64

          readelf -h qemu-out/bin/qemu-system-aarch64 \
            | grep AArch64

          readelf -l qemu-out/bin/qemu-system-aarch64 \
            | grep INTERP && {
              echo "ERROR: QEMU is dynamically linked"
              exit 1
            } || true

          chmod 755 qemu-out/bin/qemu-system-aarch64

      - name: Upload QEMU
        uses: actions/upload-artifact@v4
        with:
          name: oneemu-qemu-arm64
          path: qemu-out/
          if-no-files-found: error

  build-apk:
    name: Build Android APK
    needs: build-qemu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download QEMU
        uses: actions/download-artifact@v4
        with:
          name: oneemu-qemu-arm64
          path: qemu-out

      - name: Locate project
        run: |
          set -euo pipefail

          SET=""

          if [ -f settings.gradle.kts ]; then
            SET="settings.gradle.kts"
          else
            SET=$(find . \
              -name settings.gradle.kts \
              -not -path './qemu-out/*' \
              -not -path '*/build/*' \
              -not -path './.git/*' \
              | head -n 1 || true)
          fi

          if [ -z "$SET" ] && [ -f OneEmu.zip ]; then
            mkdir -p unpacked
            unzip -q OneEmu.zip -d unpacked

            SET=$(find unpacked \
              -name settings.gradle.kts \
              -not -path '*/build/*' \
              | head -n 1 || true)
          fi

          if [ -z "$SET" ]; then
            echo "ERROR: Project not found"
            exit 1
          fi

          PROJ=$(dirname "$SET")

          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

          echo "Project found: $PROJ"

      - name: Check project
        run: |
          set -euo pipefail

          test -f "$PROJ/app/src/main/AndroidManifest.xml"

          test -s qemu-out/bin/qemu-system-aarch64
          test -s qemu-out/share/edk2-aarch64-code.fd

      - name: Install QEMU assets
        run: |
          set -euo pipefail

          mkdir -p \
            "$PROJ/app/src/main/assets/qemu/bin" \
            "$PROJ/app/src/main/assets/qemu/share"

          cp qemu-out/bin/qemu-system-aarch64 \
            "$PROJ/app/src/main/assets/qemu/bin/"

          cp -r qemu-out/share/. \
            "$PROJ/app/src/main/assets/qemu/share/"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          set -euo pipefail

          cd "$PROJ"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify APK
        run: |
          set -euo pipefail

          APK="$PROJ/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p apk-check
          unzip -q "$APK" -d apk-check

          test -s \
            apk-check/assets/qemu/bin/qemu-system-aarch64

          test -s \
            apk-check/assets/qemu/share/edk2-aarch64-code.fd

          echo "APK verification successful"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneEmu-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
