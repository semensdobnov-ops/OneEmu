name: Build APK with QEMU
on: [push, workflow_dispatch]
jobs:
  qemu:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build static QEMU (arm64)
        run: |
          cat > build-qemu.sh <<'SCRIPT'
          set -e
          apk add --no-cache build-base git python3 py3-setuptools ninja meson pkgconf bash flex bison perl curl xz linux-headers
          for p in glib-dev glib-static pixman-dev pixman-static zlib-dev zlib-static pcre2-dev libffi-dev gettext-dev gettext-static zstd-dev zstd-static util-linux-dev; do
            apk add --no-cache "$p" || echo "SKIP $p"
          done
          cd /tmp
          curl -fLO https://download.qemu.org/qemu-9.0.2.tar.xz
          tar xf qemu-9.0.2.tar.xz
          cd qemu-9.0.2
          SLIRP=1
          (cd /tmp && git clone --depth 1 --branch v4.8.0 https://gitlab.freedesktop.org/slirp/libslirp.git && cd libslirp && meson setup build --default-library=static --prefix=/usr/local && ninja -C build install) || SLIRP=0
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig
          cd /tmp/qemu-9.0.2
          OPTS="--static --target-list=x86_64-softmmu --disable-docs --disable-tools --disable-guest-agent --disable-werror --disable-gtk --disable-sdl --disable-opengl --disable-curses --disable-kvm --disable-dbus-display --disable-gio --disable-bzip2"
          if [ "$SLIRP" = 1 ]; then
            ./configure $OPTS --enable-slirp || { echo "RETRY WITHOUT SLIRP"; ./configure $OPTS --disable-slirp; }
          else
            ./configure $OPTS --disable-slirp
          fi
          make -j"$(nproc)" qemu-system-x86_64
          mkdir -p /w/out/share
          strip build/qemu-system-x86_64
          cp build/qemu-system-x86_64 /w/out/libqemu.so
          for f in bios-256k.bin vgabios-stdvga.bin kvmvapic.bin linuxboot_dma.bin efi-virtio.rom efi-e1000.rom; do
            cp pc-bios/$f /w/out/share/
          done
          ls -la /w/out /w/out/share
          SCRIPT
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh build-qemu.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qemu
          path: out
  apk:
    needs: qemu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qemu
          path: qemu-out
      - name: Find project folder and put QEMU into the app
        run: |
          SET=$(find . -name settings.gradle.kts -not -path "./qemu-out/*" -not -path "*/build/*" | head -1)
          if [ -z "$SET" ] && [ -f OneEmu.zip ]; then
            echo "Project not found in repo, unpacking OneEmu.zip"
            unzip -q -o OneEmu.zip -d unpacked
            SET=$(find unpacked -name settings.gradle.kts | head -1)
          fi
          if [ -z "$SET" ]; then echo "settings.gradle.kts NOT FOUND. Repo contents:"; find . -maxdepth 3 -not -path "./.git/*" | head -80; exit 1; fi
          PROJ=$(dirname "$SET")
          echo "Project folder: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          F="$PROJ/app/src/main/java/com/oneemu/app/HomeScreen.kt"
          grep -q "ExperimentalFoundationApi" "$F" || sed -i '1i @file:OptIn(androidx.compose.foundation.ExperimentalFoundationApi::class)' "$F"
          sed -i 's/ *android:extractNativeLibs="true"//' "$PROJ/app/src/main/AndroidManifest.xml"
          mkdir -p "$PROJ/app/src/main/jniLibs/arm64-v8a" "$PROJ/app/src/main/assets/qemu-share"
          cp qemu-out/libqemu.so "$PROJ/app/src/main/jniLibs/arm64-v8a/libqemu.so"
          cp qemu-out/share/* "$PROJ/app/src/main/assets/qemu-share/"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: gradle -p "$PROJ" assembleDebug
      - name: Check that QEMU is inside the APK
        run: |
          unzip -l "$PROJ/app/build/outputs/apk/debug/app-debug.apk" | grep -E "libqemu.so|qemu-share/bios"
      - uses: actions/upload-artifact@v4
        with:
          name: OneEmu-APK-with-QEMU
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
