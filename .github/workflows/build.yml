
name: Build OneEmu

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneemu-${{ github.ref }}
  cancel-in-progress: true

env:
  QEMU_VERSION: "9.0.2"
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_API: "26"

jobs:
  build-qemu:
    name: Build QEMU for Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl wget python3 \
            ninja-build meson pkg-config flex bison \
            perl xz-utils bzip2 unzip file

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true

      - name: Install Android NDK
        run: |
          set -euo pipefail

          sdkmanager --install \
            "ndk;${ANDROID_NDK_VERSION}"

          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK installation failed"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK installed successfully"

      - name: Download QEMU
        run: |
          set -euo pipefail
          curl -fL \
            "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz" \
            -o qemu.tar.xz
          tar -xf qemu.tar.xz

      - name: Configure Android toolchain
        run: |
          set -euo pipefail

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Configure QEMU
        run: |
          set -euo pipefail
          cd "qemu-${QEMU_VERSION}"

          export CC="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang++"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"
          export STRIP="$TOOLCHAIN/llvm-strip"
          export CFLAGS="-O2 -fPIE"
          export CXXFLAGS="-O2 -fPIE"
          export LDFLAGS="-pie"

          ./configure \
            --target-list=aarch64-softmmu \
            --cross-prefix="$TOOLCHAIN/aarch64-linux-android-" \
            --disable-docs \
            --disable-tools \
            --disable-guest-agent \
            --disable-werror \
            --disable-gtk \
            --disable-sdl \
            --disable-opengl \
            --disable-curses \
            --disable-kvm \
            --disable-dbus-display \
            --disable-slirp \
            --disable-bzip2 \
            --disable-libudev \
            --disable-linux-aio

      - name: Compile QEMU
        run: |
          set -euo pipefail
          cd "qemu-${QEMU_VERSION}"

          make -j2 qemu-system-aarch64

          mkdir -p ../qemu-out/bin
          mkdir -p ../qemu-out/share

          cp build/qemu-system-aarch64 \
            ../qemu-out/bin/

          "$TOOLCHAIN/llvm-strip" \
            ../qemu-out/bin/qemu-system-aarch64

          bzip2 -dk pc-bios/edk2-aarch64-code.fd.bz2

          cp pc-bios/edk2-aarch64-code.fd \
            ../qemu-out/share/

      - name: Verify QEMU binary
        run: |
          set -euo pipefail

          BIN="qemu-out/bin/qemu-system-aarch64"

          test -s "$BIN"
          file "$BIN"
          readelf -h "$BIN" | grep AArch64

          echo "QEMU binary exists"

      - name: Upload QEMU
        uses: actions/upload-artifact@v4
        with:
          name: oneemu-qemu-arm64
          path: qemu-out/
          if-no-files-found: error

  build-apk:
    name: Build OneEmu APK
    needs: build-qemu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download QEMU
        uses: actions/download-artifact@v4
        with:
          name: oneemu-qemu-arm64
          path: qemu-out

      - name: Locate project
        run: |
          set -euo pipefail

          SET=""

          if [ -f settings.gradle.kts ]; then
            SET="settings.gradle.kts"
          elif [ -f settings.gradle ]; then
            SET="settings.gradle"
          else
            SET=$(find . \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/build/*' \
              -not -path './.git/*' \
              | head -n 1 || true)
          fi

          if [ -z "$SET" ] && [ -f OneEmu.zip ]; then
            mkdir -p unpacked
            unzip -q OneEmu.zip -d unpacked
            SET=$(find unpacked \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/build/*' \
              | head -n 1 || true)
          fi

          if [ -z "$SET" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJ=$(dirname "$SET")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - name: Install QEMU assets
        run: |
          set -euo pipefail

          DEST="$PROJ/app/src/main/assets/qemu"

          mkdir -p "$DEST/bin" "$DEST/share"

          cp qemu-out/bin/qemu-system-aarch64 "$DEST/bin/"
          cp -r qemu-out/share/. "$DEST/share/"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          set -euo pipefail
          cd "$PROJ"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify APK
        run: |
          set -euo pipefail

          APK="$PROJ/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p apk-check
          unzip -q "$APK" -d apk-check

          test -s apk-check/assets/qemu/bin/qemu-system-aarch64
          test -s apk-check/assets/qemu/share/edk2-aarch64-code.fd

          echo "APK verification passed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneEmu-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
